<svg viewBox="0 0 300 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="100" fill="#f8f9fa" rx="4"/>

  <!-- Logo Circle -->
  <circle cx="40" cy="50" r="35" fill="#003366" stroke="#0066cc" stroke-width="2"/>

  <!-- CA Letters inside circle -->
  <text x="40" y="62" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">CA</text>

  <!-- Company Name -->
  <text x="85" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#003366">CADFEM</text>
  <text x="85" y="60" font-family="Arial, sans-serif" font-size="14" fill="#0066cc" font-weight="600">Asset Management</text>

  <!-- Decorative line -->
  <line x1="85" y1="65" x2="280" y2="65" stroke="#0066cc" stroke-width="2"/>
</svg>
